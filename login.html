<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ca10 OS — Entrar</title>
    <link href="index.css" rel="stylesheet">
    <link href="login.css" rel="stylesheet">
</head>
<body class="auth-body">

    <div class="auth-bg">
        <div class="auth-orb auth-orb-1"></div>
        <div class="auth-orb auth-orb-2"></div>
    </div>

    <div class="auth-card" id="authCard">

        <!-- LOGO -->
        <div class="auth-logo">
            <span class="auth-logo-icon">🎓</span>
            <div>
                <div class="auth-logo-name">Ca10 OS</div>
                <div class="auth-logo-sub">Gestão Escolar Premium</div>
            </div>
        </div>

        <!-- FORMULÁRIO LOGIN -->
        <div id="formLogin">
            <div class="auth-field">
                <label class="auth-label">Email</label>
                <input
                    type="email"
                    id="loginEmail"
                    class="auth-input"
                    placeholder="o.teu@email.com"
                    autocomplete="email"
                    onkeypress="if(event.key==='Enter') document.getElementById('loginPassInput').focus()"
                >
            </div>
            <div class="auth-field">
                <label class="auth-label">Palavra-passe</label>
                <div class="auth-input-wrap">
                    <input
                        type="password"
                        id="loginPassInput"
                        class="auth-input"
                        placeholder="••••••••"
                        autocomplete="current-password"
                        onkeypress="if(event.key==='Enter') handleLogin()"
                    >
                    <button class="auth-eye" onclick="togglePass('loginPassInput', this)" tabindex="-1">👁</button>
                </div>
            </div>
            <div class="auth-error hidden" id="loginError"></div>
            <button class="auth-btn" id="loginBtn" onclick="handleLogin()">
                <span id="loginBtnText">Entrar</span>
                <span id="loginSpinner" class="auth-spinner hidden"></span>
            </button>
        </div>

        <!-- MENSAGEM SUCESSO -->
        <div id="authSuccess" class="auth-success hidden">
            <span class="auth-success-icon">✅</span>
            <span id="authSuccessMsg">A redirecionar...</span>
        </div>

    </div>

    <script type="module" src="firebase.js"></script>
    <script type="module" src="auth.js"></script>
    <script src="login.js"></script>

</body>
</html>
